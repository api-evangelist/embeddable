name: Embeddable
description: >-
  Embeddable is a developer toolkit for building customer-facing, embedded analytics
  into your own application. Engineers define components, data models, and themes in
  code (version-controlled in their own repo), and their team assembles and publishes
  dashboards with either a no-code builder or directly in code. A governed semantic
  layer built on the open-source Cube modeling language defines metrics, dimensions,
  and joins once so every chart, dashboard, and AI experience reuses the same trusted
  definitions. Dashboards embed as native web components (no iframes) authorized with
  short-lived JWT security tokens, with server-side row-level security for multi-tenant
  isolation. Embeddable ships the Remarkable Pro React component suite, open-source
  component libraries, a code-first CLI workflow, and a small set of server-side REST
  Public APIs (tokens, embeddables, versions, schemas). The platform is SOC 2 Type II
  certified and GDPR compliant. Embeddable is built by the London team behind Trevor.io.
