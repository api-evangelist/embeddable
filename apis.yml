    Server-side REST APIs for managing Embeddable deployments — mint short-lived JWT
    security tokens for embeds, list embeddables (dashboards), manage published
    versions, and read data-model schemas. All endpoints are Bearer-token
    authenticated and must be called from server-side code only.
